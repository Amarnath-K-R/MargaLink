name: check

# Deliberately narrow: no `next build`, no Playwright. Both need
# web/public/index/{manifest.json,index.bin,meta.json}, which is gitignored
# (produced by the pipeline, ~7MB+10MB of real data) — running either here
# would be red from the first commit. Everything below runs on source alone.
"on":
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check

  # The figure renderer (web/public/figurelib.py) under CPython with the same
  # library versions Pyodide ships; also proves every gallery template renders.
  figurelib:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/figurelib
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync
      - run: uv run selfcheck.py
      - run: uv run ruff check . ../public/figurelib.py

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync
      - run: uv run selfcheck.py
      - run: uv run ruff check .
